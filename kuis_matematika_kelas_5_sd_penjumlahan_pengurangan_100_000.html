    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;

            box-shadow: 6px 7px 0px #0f172a;
        }
        .comic-btn {
            box-shadow: 3px 4px 0px #0f172a;
            transition: all 0.15s ease-in-out;
        }
        .comic-btn:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 5px 6px 0px #0f172a;
        }
        .comic-btn:active:not(:disabled) {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px #0f172a;
        }

            touch-action: none;
            cursor: crosshair;
        }

            animation: pulseGlow 2s infinite alternate;
        }

            0% { transform: scale(1); }
            100% { transform: scale(1.02); }

</head>
<body class="pb-16 min-h-screen">

    <script>
        // Web Audio Synthesizer for Reliable Sound Effects
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        const SoundFX = {
            playSuccess() {
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } catch(e) {}
            },
            playWrong() {
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(130.81, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } catch(e) {}
            },
            playClick() {
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                } catch(e) {}
            }
        };

        // 30 MASTER QUESTIONS DATASET FOR GRADE 5 SD (UP TO 100,000)
        const mainQuizData = [
            // Kategori 1: Penjumlahan & Pengurangan 5 Digit Biasa (10 Soal)

            { id: 6, cat: "5 Digit Biasa", catColor: "bg-sky-200 text-sky-900", q: "78.654 - 34.211 = ...", opts: [44443, 44343, 45443], ans: 44443, exp: "Pengurangan bersusun dari kanan: 4-1=3, 5-1=4, 6-2=4, 8-4=4, 7-3=4 → Hasil: 44.443" },
            { id: 7, cat: "5 Digit Biasa", catColor: "bg-sky-200 text-sky-900", q: "89.540 - 43.210 = ...", opts: [46330, 46230, 47330], ans: 46330, exp: "Pengurangan lurus: 0-0=0, 4-1=3, 5-2=3, 9-3=6, 8-4=4 → Hasil: 46.330" },

            { id: 12, cat: "⚡ Trik Super 99.999", catColor: "bg-purple-200 text-purple-900", q: "80.000 - 36.524 = ...", opts: [43476, 43576, 42476], ans: 43476, exp: "💡 Ubah jadi: 79.999 - 36.523 = 43.476!" },
            { id: 13, cat: "⚡ Trik Super 99.999", catColor: "bg-purple-200 text-purple-900", q: "100.000 - 42.350 = ...", opts: [57650, 58650, 56650], ans: 57650, exp: "💡 Ubah jadi: 99.999 - 42.349 = 57.650!" },
            { id: 14, cat: "⚡ Trik Super 99.999", catColor: "bg-purple-200 text-purple-900", q: "60.000 - 18.752 = ...", opts: [41248, 41348, 42248], ans: 41248, exp: "💡 Ubah jadi: 59.999 - 18.751 = 41.248!" },
            { id: 15, cat: "⚡ Trik Super 99.999", catColor: "bg-purple-200 text-purple-900", q: "70.000 - 34.825 = ...", opts: [35175, 35275, 36175], ans: 35175, exp: "💡 Ubah jadi: 69.999 - 34.824 = 35.175!" },
            { id: 16, cat: "🔥 Simpan 4 Kolom", catColor: "bg-amber-200 text-amber-900", q: "46.789 + 38.456 = ...", opts: [85245, 85145, 84245], ans: 85245, exp: "Satuan 9+6=15 (tulis 5, simpan 1). Puluhan 8+5+1=14 (tulis 4, simpan 1). Ratusan 7+4+1=12 (tulis 2, simpan 1). Ribuan 6+8+1=15 (tulis 5, simpan 1). Puluh Ribuan 4+3+1=8 → 85.245" },
            { id: 17, cat: "🔥 Simpan 4 Kolom", catColor: "bg-amber-200 text-amber-900", q: "58.967 + 27.578 = ...", opts: [86545, 86445, 85545], ans: 86545, exp: "7+8=15 (simpan 1), 6+7+1=14 (simpan 1), 9+5+1=15 (simpan 1), 8+7+1=16 (simpan 1), 5+2+1=8 → 86.545" },
            { id: 18, cat: "🔄 Pinjam Beruntun", catColor: "bg-rose-200 text-rose-900", q: "40.005 - 16.284 = ...", opts: [23721, 23821, 24721], ans: 23721, exp: "Meminjam dari angka 4 di tempat puluh ribuan → Hasil akhir: 23.721" },
            { id: 19, cat: "⚡ Trik Super 99.999", catColor: "bg-purple-200 text-purple-900", q: "90.000 - 54.321 = ...", opts: [35679, 35779, 34679], ans: 35679, exp: "💡 Ubah jadi: 89.999 - 54.320 = 35.679!" },
            { id: 20, cat: "⚡ Trik Super 99.999", catColor: "bg-purple-200 text-purple-900", q: "30.000 - 12.485 = ...", opts: [17515, 17615, 18515], ans: 17515, exp: "💡 Ubah jadi: 29.999 - 12.484 = 17.515!" },

            // Kategori 3: Soal Cerita Kehidupan Nyata & Operasi Campuran (10 Soal)
            { id: 21, cat: "🎟️ Soal Cerita", catColor: "bg-emerald-200 text-emerald-900", q: "Panitia pertandingan menjual 42.500 tiket utama dan 28.750 tiket VIP. Berapa total tiket yang terjual?", opts: [71250, 70250, 71350], ans: 71250, exp: "Operasi Penjumlahan: 42.500 + 28.750 = 71.250 tiket" },
            { id: 22, cat: "💼 Soal Cerita", catColor: "bg-emerald-200 text-emerald-900", q: "Kas kelas 5 berjumlah Rp 85.000, lalu digunakan membeli perlengkapan pentas seharga Rp 32.500. Berapa sisa kas?", opts: [52500, 53500, 51500], ans: 52500, exp: "Operasi Pengurangan: Rp 85.000 - Rp 32.500 = Rp 52.500" },
            { id: 23, cat: "🌾 Soal Cerita", catColor: "bg-emerald-200 text-emerald-900", q: "Target panen padi desa adalah 100.000 kg. Jika baru terkumpul 64.250 kg, berapa kg padi yang masih kurang?", opts: [35750, 36750, 35650], ans: 35750, exp: "💡 Trik Cepat: 99.999 - 64.249 = 35.750 kg!" },
            { id: 24, cat: "📚 Soal Cerita", catColor: "bg-emerald-200 text-emerald-900", q: "Koperasi sekolah memasok 25.000 buku tulis dan 38.500 pensil. Berapa total perlengkapan sekolah tersebut?", opts: [63500, 62500, 64500], ans: 63500, exp: "Operasi Penjumlahan: 25.000 + 38.500 = 63.500 unit" },
            { id: 25, cat: "🔢 Kombinasi Hitung", catColor: "bg-indigo-200 text-indigo-900", q: "25.000 + 35.000 - 18.500 = ...", opts: [41500, 42500, 40500], ans: 41500, exp: "Langkah 1: 25.000 + 35.000 = 60.000. Langkah 2: 60.000 - 18.500 = 41.500" },
            { id: 26, cat: "💰 Soal Cerita Modal", catColor: "bg-emerald-200 text-emerald-900", q: "Koperasi kelas 5 punya modal Rp 95.000, lalu membeli perlengkapan toko seharga Rp 47.500. Berapa sisa modal?", opts: [47500, 46500, 48500], ans: 47500, exp: "Operasi Pengurangan: Rp 95.000 - Rp 47.500 = Rp 47.500" },
            { id: 27, cat: "🔢 Kombinasi Hitung", catColor: "bg-indigo-200 text-indigo-900", q: "60.000 - 25.000 + 12.500 = ...", opts: [47500, 46500, 48500], ans: 47500, exp: "Langkah 1: 60.000 - 25.000 = 35.000. Langkah 2: 35.000 + 12.500 = 47.500" },
            { id: 28, cat: "🏛️ Soal Cerita", catColor: "bg-emerald-200 text-emerald-900", q: "Pengunjung museum pada hari Sabtu 37.500 orang dan hari Minggu 48.500 orang. Berapa total pengunjung 2 hari?", opts: [86000, 85000, 87000], ans: 86000, exp: "Operasi Penjumlahan: 37.500 + 48.500 = 86.000 orang" },
            { id: 29, cat: "👕 Soal Cerita", catColor: "bg-emerald-200 text-emerald-900", q: "Toko seragam memiliki stok 50.000 stel. Terjual sebanyak 31.250 stel. Berapa seragam yang tersisa?", opts: [18750, 18650, 19750], ans: 18750, exp: "💡 Trik Cepat: 49.999 - 31.249 = 18.750 stel!" },
            { id: 30, cat: "🏆 Tantangan Master Kelas 5", catColor: "bg-amber-300 text-amber-950", q: "100.000 - 35.000 - 22.500 = ...", opts: [42500, 43500, 41500], ans: 42500, exp: "Langkah 1: 100.000 - 35.000 = 65.000. Langkah 2: 65.000 - 22.500 = 42.500. Selamat! Kamu resmi lulus Master Matematika Kelas 5 SD!" }
        ];

        let currentQuizIdx = 0;
        let quizUserAnswers = new Array(mainQuizData.length).fill(null);
        let quizScore = 0;
        let quizStreak = 0;

        function renderMainQuizCard() {
            const container = document.getElementById('main-quiz-container');
            const navControls = document.getElementById('quiz-nav-controls');
            if (!container) return;

            if (currentQuizIdx >= mainQuizData.length) {
                showQuizSummary();
                return;
            }

            const item = mainQuizData[currentQuizIdx];
            const progressPercent = ((currentQuizIdx + 1) / mainQuizData.length) * 100;
            document.getElementById('quiz-progress-text').textContent = `Soal ${currentQuizIdx + 1} dari ${mainQuizData.length}`;
            document.getElementById('quiz-progress-bar').style.width = `${progressPercent}%`;

            const badgeCat = document.getElementById('quiz-badge-category');
            badgeCat.textContent = item.cat;
            badgeCat.className = `px-2.5 py-0.5 rounded-lg border border-slate-900 font-black ${item.catColor}`;

            navControls.classList.remove('hidden');

            const isAnswered = quizUserAnswers[currentQuizIdx] !== null;
            const selectedVal = quizUserAnswers[currentQuizIdx];

            let optionsHTML = item.opts.map(opt => {
                let btnStyle = "bg-white border-2 border-slate-900 text-slate-800 hover:bg-indigo-100";
                let statusIcon = "";

                if (isAnswered) {
                    if (opt === item.ans) {
                        btnStyle = "bg-emerald-400 border-2 border-slate-900 text-slate-900 font-black";
                        statusIcon = " <i class='fa-solid fa-circle-check text-emerald-900'></i>";
                    } else if (opt === selectedVal && selectedVal !== item.ans) {
                        btnStyle = "bg-rose-400 border-2 border-slate-900 text-white font-black";
                        statusIcon = " <i class='fa-solid fa-circle-xmark text-white'></i>";
                    } else {
                        btnStyle = "bg-slate-100 border-2 border-slate-300 text-slate-400 opacity-60";
                    }
                }

                return `
                    <button onclick="submitMainQuizAnswer(${currentQuizIdx}, ${opt}, this)" 
                            ${isAnswered ? 'disabled' : ''} 
                            class="comic-btn py-3 px-3 rounded-2xl font-black text-sm sm:text-base text-center transition-all ${btnStyle}">
                        ${opt.toLocaleString('id-ID')}${statusIcon}
                    </button>
                `;
            }).join('');

            let feedbackHTML = "";
            if (isAnswered) {
                const isCorrect = selectedVal === item.ans;
                feedbackHTML = `
                    <div class="p-3.5 border-2 border-slate-900 rounded-2xl ${isCorrect ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-900'} text-xs font-bold space-y-1">
                        <div class="font-black text-sm flex items-center gap-2">
                            ${isCorrect ? '🎉 Jawabanmu Benar! (+100 Poin)' : '💡 Penjelasan / Cara Cepat Kelas 5:'}
                        </div>
                        <div>${item.exp}</div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="bg-slate-50 border-3 border-slate-900 p-5 rounded-3xl space-y-4 comic-card">
                    <div class="flex items-center justify-between">
                        <span class="px-3 py-1 bg-white border-2 border-slate-900 rounded-xl text-xs font-black text-slate-800">
                            #${item.id} - ${item.cat}
                        </span>
                        <span class="text-xs font-black ${isAnswered ? (selectedVal === item.ans ? 'text-emerald-600' : 'text-rose-600') : 'text-slate-400'}">
                            ${isAnswered ? (selectedVal === item.ans ? '✅ Terjawab Benar' : '❌ Salah') : '⏳ Belum Dijawab'}
                        </span>
                    </div>

                    <div class="bg-white border-3 border-slate-900 p-4 sm:p-5 rounded-2xl text-center shadow-sm">
                        <h3 class="text-lg sm:text-xl font-black text-slate-900 leading-snug font-heading">${item.q}</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        ${optionsHTML}
                    </div>

                    ${feedbackHTML}
                </div>
            `;

            const prevBtn = document.getElementById('btn-prev-q');
            const nextBtn = document.getElementById('btn-next-q');
            
            prevBtn.disabled = (currentQuizIdx === 0);

            if (currentQuizIdx === mainQuizData.length - 1) {
                nextBtn.innerHTML = `Lihat Hasil Akhir 🎉`;
                nextBtn.className = "comic-btn px-5 py-2 bg-emerald-400 hover:bg-emerald-500 text-slate-900 border-2 border-slate-900 rounded-xl font-black text-xs sm:text-sm flex items-center gap-1.5";
            } else {
                nextBtn.innerHTML = `Soal Selanjutnya <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.className = "comic-btn px-5 py-2 bg-amber-400 hover:bg-amber-500 text-slate-900 border-2 border-slate-900 rounded-xl font-black text-xs sm:text-sm flex items-center gap-1.5";
            }
        }

        function submitMainQuizAnswer(qIdx, selected, btn) {
            if (quizUserAnswers[qIdx] !== null) return;

            quizUserAnswers[qIdx] = selected;
            const target = mainQuizData[qIdx];

            if (selected === target.ans) {
                SoundFX.playSuccess();
                quizScore += 100;
                quizStreak += 1;
            } else {
                SoundFX.playWrong();
                quizStreak = 0;
            }

            document.getElementById('quiz-score').textContent = quizScore;
            document.getElementById('quiz-streak').textContent = quizStreak;

            renderMainQuizCard();
        }

        function nextQuizQuestion() {
            SoundFX.playClick();
            if (currentQuizIdx < mainQuizData.length - 1) {
                currentQuizIdx++;
                renderMainQuizCard();
            } else {
                showQuizSummary();
            }
        }

        function prevQuizQuestion() {
            SoundFX.playClick();
            if (currentQuizIdx > 0) {
                currentQuizIdx--;
                renderMainQuizCard();
            }
        }

        function showQuizSummary() {
            const container = document.getElementById('main-quiz-container');
            const navControls = document.getElementById('quiz-nav-controls');
            if (!container) return;

            navControls.classList.add('hidden');

            const correctCount = quizUserAnswers.filter((ans, idx) => ans === mainQuizData[idx].ans).length;
            const accuracy = Math.round((correctCount / mainQuizData.length) * 100);

            let stars = "⭐⭐⭐";
            let titleText = "Luar Biasa! Kamu Juara Matematika Kelas 5 Sejati! 👑";
            if (accuracy < 60) {
                stars = "⭐";
                titleText = "Terus Semangat Latihan Kelas 5 Ya! 💪";
            } else if (accuracy < 85) {
                stars = "⭐⭐";
                titleText = "Hebat Sekali! Sedikit Lagi Sempurna! 🚀";
            }

            container.innerHTML = `
                <div class="bg-gradient-to-br from-amber-50 via-sky-50 to-purple-50 border-4 border-slate-900 p-6 rounded-3xl text-center space-y-4 comic-card">
                    <div class="text-4xl bounce-gentle">${stars}</div>
                    <h3 class="text-xl sm:text-2xl font-black text-slate-900 font-heading">${titleText}</h3>
                    <p class="text-xs font-bold text-slate-600">Kamu telah menyelesaikan seluruh 30 soal kuis matematika bersusun 100.000!</p>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2">
                        <div class="bg-white border-2 border-slate-900 p-3 rounded-2xl">
                            <div class="text-xs font-bold text-slate-500">Total Skor</div>
                            <div class="text-xl font-black text-emerald-600">${quizScore} / 3000</div>
                        </div>
                        <div class="bg-white border-2 border-slate-900 p-3 rounded-2xl">
                            <div class="text-xs font-bold text-slate-500">Jawaban Benar</div>
                            <div class="text-xl font-black text-sky-600">${correctCount} / 30 Soal</div>
                        </div>
                        <div class="bg-white border-2 border-slate-900 p-3 rounded-2xl col-span-2 sm:col-span-1">
                            <div class="text-xs font-bold text-slate-500">Tingkat Akurasi</div>
                            <div class="text-xl font-black text-purple-600">${accuracy}%</div>
                        </div>
                    </div>

                    <div class="pt-3 flex justify-center gap-3">
                        <button onclick="resetMainQuiz()" class="comic-btn px-6 py-3 bg-amber-400 hover:bg-amber-500 text-slate-900 border-2 border-slate-900 rounded-2xl font-black text-sm">
                            🔄 Ulangi Kuis Dari Awal
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('quiz-progress-text').textContent = `Selesai 30 Soal!`;
            document.getElementById('quiz-progress-bar').style.width = `100%`;
        }

        function resetMainQuiz() {
            SoundFX.playClick();
            quizScore = 0;
            quizStreak = 0;
            currentQuizIdx = 0;
            quizUserAnswers.fill(null);
            document.getElementById('quiz-score').textContent = '0';
            document.getElementById('quiz-streak').textContent = '0';
            renderMainQuizCard();
        }

        function toggleScratchpad() {
            const container = document.getElementById('scratchpad-container');
            container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) {
                initCanvas();
            }
        }

        let canvas, ctx, isDrawing = false;

        function initCanvas() {
            canvas = document.getElementById('scratchpad');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            
            // Adjust canvas dimension
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            ctx.strokeStyle = '#fde047'; // yellow chalk color
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';

            // Event Listeners
            canvas.onmousedown = (e) => startDraw(e.offsetX, e.offsetY);
            canvas.onmousemove = (e) => draw(e.offsetX, e.offsetY);
            canvas.onmouseup = () => stopDraw();

            canvas.ontouchstart = (e) => {
                const r = canvas.getBoundingClientRect();
                const t = e.touches[0];
                startDraw(t.clientX - r.left, t.clientY - r.top);
            };
            canvas.ontouchmove = (e) => {
                const r = canvas.getBoundingClientRect();
                const t = e.touches[0];
                draw(t.clientX - r.left, t.clientY - r.top);
            };
            canvas.ontouchend = () => stopDraw();
        }

        function startDraw(x, y) { isDrawing = true; ctx.beginPath(); ctx.moveTo(x, y); }
        function draw(x, y) { if (isDrawing) { ctx.lineTo(x, y); ctx.stroke(); } }
        function stopDraw() { isDrawing = false; }
        function clearScratchpad() { if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height); }

        window.onload = function() {
            renderMainQuizCard();
        };
    </script>
</body>
</html>
