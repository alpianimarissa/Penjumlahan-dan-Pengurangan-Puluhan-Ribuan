<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Penjumlahan & Pengurangan Bersusun Pintar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700;800&family=Fira+Code:wght@600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', 'Quicksand', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }

    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 40%, #fef3c7 100%);
            min-height: 100vh;
        }
        .comic-card {
            box-shadow: 0 8px 0px 0px rgba(15, 23, 42, 0.12);
        }
        .comic-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0px 0px #1e293b;
        }
        .comic-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px 0px #1e293b;
        }
        .comic-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0px 0px #1e293b;
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-short {
            animation: bounce-short 0.4s ease-in-out 2;
        }
    </style>
</head>
<body class="text-slate-800 pb-12 select-none">

    <script>
        // Audio Synthesizer (Web Audio API)
        const SoundFX = {
            ctx: null,
            enabled: true,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            toggleSound() {
                this.enabled = !this.enabled;
                const btn = document.getElementById('sound-toggle-btn');
                if (btn) {
                    btn.innerHTML = this.enabled 
                        ? '<i class="fa-solid fa-volume-high"></i>' 
                        : '<i class="fa-solid fa-volume-xmark text-rose-400"></i>';
                }
            },
            playClick() {
                if (!this.enabled) return;
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            },
            playSuccess() {
                if (!this.enabled) return;
                this.init();
                let now = this.ctx.currentTime;
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                    gain.gain.setValueAtTime(0.1, now + idx * 0.06);
                    gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.06 + 0.12);
                    osc.start(now + idx * 0.06);
                    osc.stop(now + idx * 0.06 + 0.14);
                });
            },
            playWrong() {
                if (!this.enabled) return;
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.26);
            }
        };
    </script>

    <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b-4 border-slate-900 px-4 py-3 mb-6">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-3xl sm:text-4xl">➕➖</span>
                <div>
                    <h1 class="text-lg sm:text-2xl font-black text-slate-900 leading-tight">KUIS HITUNG BERSUSUN</h1>
                    <p class="text-[11px] sm:text-xs font-bold text-indigo-600">Penjumlahan & Pengurangan (sd 100.000)</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <button id="sound-toggle-btn" onclick="SoundFX.toggleSound()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 border-2 border-slate-900 rounded-2xl flex items-center justify-center text-slate-800 font-bold transition-all" title="Suara">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button onclick="resetStatsModal()" class="w-10 h-10 bg-rose-100 hover:bg-rose-200 border-2 border-slate-900 rounded-2xl flex items-center justify-center text-rose-700 font-bold transition-all" title="Reset Skor">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-4 space-y-6">

        <!-- Score & Stats Bar -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-amber-100 border-3 border-slate-900 rounded-2xl p-3 text-center comic-card">
                <span class="text-[10px] sm:text-xs font-black uppercase text-amber-800 block">🔥 Beruntun</span>
                <span id="streak-count" class="text-xl sm:text-2xl font-black text-slate-900">0</span>
            </div>
            <div class="bg-emerald-100 border-3 border-slate-900 rounded-2xl p-3 text-center comic-card">
                <span class="text-[10px] sm:text-xs font-black uppercase text-emerald-800 block">⭐ Total XP</span>
                <span id="score-count" class="text-xl sm:text-2xl font-black text-slate-900">0</span>
            </div>
            <div class="bg-indigo-100 border-3 border-slate-900 rounded-2xl p-3 text-center comic-card">
                <span class="text-[10px] sm:text-xs font-black uppercase text-indigo-800 block">🏆 Rekor XP</span>
                <span id="highscore-count" class="text-xl sm:text-2xl font-black text-slate-900">0</span>
            </div>
        </div>

        <section class="bg-white rounded-3xl border-4 border-slate-900 p-5 comic-card space-y-3">
            <h2 class="text-sm font-black uppercase text-slate-500 tracking-wider flex items-center gap-2">
                <span>🎯</span> Pilih Kategori Latihan:
            </h2>

            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                <button onclick="selectCategory('puluhan')" id="cat-puluhan" class="cat-btn comic-btn p-3 bg-indigo-500 text-white border-2 border-slate-900 rounded-2xl text-center">
                    <span class="text-lg block">🔢</span>
                    <span class="font-black text-xs block">Puluhan</span>
                </button>
                <button onclick="selectCategory('ratusan')" id="cat-ratusan" class="cat-btn comic-btn p-3 bg-slate-100 text-slate-800 border-2 border-slate-900 rounded-2xl text-center">
                    <span class="text-lg block">💯</span>
                    <span class="font-black text-xs block">Ratusan</span>
                </button>
                <button onclick="selectCategory('ribuan')" id="cat-ribuan" class="cat-btn comic-btn p-3 bg-slate-100 text-slate-800 border-2 border-slate-900 rounded-2xl text-center">
                    <span class="text-lg block">🚀</span>
                    <span class="font-black text-xs block">Ribuan</span>
                </button>
                <button onclick="selectCategory('puluhanribu')" id="cat-puluhanribu" class="cat-btn comic-btn p-3 bg-slate-100 text-slate-800 border-2 border-slate-900 rounded-2xl text-center">
                    <span class="text-lg block">👑</span>
                    <span class="font-black text-xs block">Puluhan Ribu</span>
                </button>
                <button onclick="selectCategory('campuran')" id="cat-campuran" class="cat-btn comic-btn p-3 bg-slate-100 text-slate-800 border-2 border-slate-900 rounded-2xl text-center col-span-2 sm:col-span-1">
                    <span class="text-lg block">🎲</span>
                    <span class="font-black text-xs block">Campuran</span>
                </button>
            </div>
        </section>

        <main id="quiz-container" class="bg-gradient-to-br from-indigo-50 via-white to-amber-50 rounded-3xl border-4 border-slate-900 p-6 comic-card space-y-6">
            <!-- Dynamic Content loaded via JS -->
        </main>

    </div>

    <!-- Custom Modal Reset Confirmation -->
    <div id="reset-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white border-4 border-slate-900 rounded-3xl p-6 max-w-sm w-full space-y-4 comic-card text-center">
            <span class="text-4xl">⚠️</span>
            <h3 class="text-xl font-black text-slate-900">Reset Seluruh Skor?</h3>
            <p class="text-xs font-bold text-slate-600">Semua XP dan rekor hitunganmu akan kembali ke angka 0.</p>
            <div class="flex gap-2 pt-2">
                <button onclick="closeResetModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 border-2 border-slate-900 rounded-xl font-black text-xs text-slate-800">
                    Batal
                </button>
                <button onclick="confirmReset()" class="flex-1 py-2.5 bg-rose-500 hover:bg-rose-600 text-white border-2 border-slate-900 rounded-xl font-black text-xs">
                    Ya, Reset!
                </button>
            </div>
        </div>
    </div>

    <footer class="text-center text-xs font-bold text-slate-500 mt-8">
        Kuis Penjumlahan & Pengurangan Bersusun Pintar • SD Kelas 3 - 5
    </footer>

    <script>
        // Global Quiz State
        let currentCategory = 'puluhan';
        let currentQuestion = null;
        let score = 0;
        let streak = 0;
        let highscore = parseInt(localStorage.getItem('quiz_bersusun_highscore')) || 0;
        let questionNumber = 1;

        // Category Configurations
        const categories = {
            puluhan: { name: '🔢 Puluhan', min: 12, max: 99, label: 'Kategori Puluhan' },
            ratusan: { name: '💯 Ratusan', min: 105, max: 999, label: 'Kategori Ratusan' },
            ribuan: { name: '🚀 Ribuan', min: 1050, max: 9999, label: 'Kategori Ribuan' },
            puluhanribu: { name: '👑 Puluhan Ribu', min: 10500, max: 49999, label: 'Kategori Puluhan Ribu' },
            campuran: { name: '🎲 Campuran', min: 10, max: 50000, label: 'Kategori Campuran' }
        };

        // Utility: Format numbers to ID locale (e.g. 45820 -> "45.820")
        function formatNum(num) {
            return num.toLocaleString('id-ID');
        }

        // Random Integer Generator
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Question Generator
        function generateQuestion() {
            let activeCat = currentCategory;
            if (activeCat === 'campuran') {
                const keys = ['puluhan', 'ratusan', 'ribuan', 'puluhanribu'];
                activeCat = keys[getRandomInt(0, keys.length - 1)];
            }

            const config = categories[activeCat];
            const isAdd = Math.random() < 0.5; // 50% chance Addition, 50% Subtraction
            let num1, num2, ans;

            if (isAdd) {
                num1 = getRandomInt(config.min, config.max);
                num2 = getRandomInt(config.min, config.max);
                
                // Keep max sum within 100.000 limit
                if (num1 + num2 > 100000) {
                    num1 = Math.floor(num1 / 2);
                    num2 = Math.floor(num2 / 2);
                }
                ans = num1 + num2;
            } else {
                // Subtraction (Ensure num1 > num2)
                num1 = getRandomInt(config.min, config.max);
                num2 = getRandomInt(config.min, num1);

                // 25% chance to force "Zero Streak" numbers for higher challenge (e.g., 500, 1000, 10000)
                if (Math.random() < 0.25 && activeCat !== 'puluhan') {
                    if (activeCat === 'ratusan') num1 = getRandomInt(2, 9) * 100;
                    else if (activeCat === 'ribuan') num1 = getRandomInt(2, 9) * 1000;
                    else if (activeCat === 'puluhanribu') num1 = getRandomInt(1, 5) * 10000;
                    
                    num2 = getRandomInt(Math.floor(num1 * 0.2), num1 - 15);
                }
                ans = num1 - num2;
            }

            // Generate 3 Smart Distractors
            let optionsSet = new Set();
            optionsSet.add(ans);

            // Off by 10, off by 100, off by 1, off by 1000, swap digits
            const variations = [
                ans + 10, ans - 10,
                ans + 100, ans - 100,
                ans + 1, ans - 1,
                ans + 2, ans - 2,
                ans + 1000, ans - 1000
            ];

            for (let v of variations) {
                if (v > 0 && v !== ans && optionsSet.size < 4) {
                    optionsSet.add(v);
                }
            }

            // Fill remaining if needed
            while (optionsSet.size < 4) {
                let randomOffset = getRandomInt(-15, 15) * 10;
                let fake = ans + randomOffset;
                if (fake > 0 && fake !== ans) optionsSet.add(fake);
            }

            // Shuffle options
            const optionsArr = Array.from(optionsSet).sort(() => Math.random() - 0.5);

            return {
                num1,
                num2,
                type: isAdd ? 'add' : 'sub',
                ans,
                options: optionsArr,
                categoryKey: activeCat
            };
        }

        function renderQuiz() {
            currentQuestion = generateQuestion();
            const quizBox = document.getElementById('quiz-container');

            const opSign = currentQuestion.type === 'add' ? '+' : '-';
            const opTitle = currentQuestion.type === 'add' ? 'Hitung Penjumlahan Bersusun' : 'Hitung Pengurangan Bersusun';
            const catInfo = categories[currentCategory];

            let optsHtml = currentQuestion.options.map(opt => `
                <button onclick="checkAnswer(${opt}, this)" class="opt-btn comic-btn p-4 bg-white hover:bg-indigo-50 border-3 border-slate-900 rounded-2xl font-black text-slate-800 text-lg sm:text-2xl text-center transition-all">
                    ${formatNum(opt)}
                </button>
            `).join('');

            quizBox.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="px-3 py-1 bg-indigo-100 border border-slate-900 text-indigo-950 rounded-xl text-xs font-black uppercase">
                        ${catInfo.name} • Soal #${questionNumber}
                    </span>
                    <span class="text-xs font-bold text-slate-500">Gunakan kertas orat-aret! 📝</span>
                </div>

                <!-- Math Visual Display -->
                <div class="bg-white border-4 border-slate-900 rounded-2xl p-6 text-center space-y-3 comic-card relative overflow-hidden">
                    <span class="text-[10px] font-black text-indigo-700 uppercase tracking-widest bg-indigo-100 px-3 py-1 rounded-full border border-slate-900 inline-block">
                        ${opTitle}
                    </span>

                    <div class="flex items-center justify-center gap-2 sm:gap-4 text-3xl sm:text-5xl font-black text-slate-900 tracking-wider my-4 font-mono">
                        <span class="text-emerald-600">${formatNum(currentQuestion.num1)}</span>
                        <span class="text-slate-400 font-sans">${opSign}</span>
                        <span class="text-sky-600">${formatNum(currentQuestion.num2)}</span>
                        <span class="text-slate-400 font-sans">=</span>
                        <span class="text-amber-500 font-sans">?</span>
                    </div>

                    <p class="text-xs text-slate-500 font-bold">💡 Susun angka tegak lurus dari kanan ke kiri untuk mempermudah!</p>
                </div>

                <!-- Options Grid -->
                <div class="grid grid-cols-2 gap-3" id="options-container">
                    ${optsHtml}
                </div>

                <!-- Feedback Area -->
                <div id="quiz-feedback" class="hidden p-4 rounded-2xl border-3 border-slate-900 text-center font-black text-sm sm:text-base flex items-center justify-center gap-2"></div>

                <!-- Next Question Button -->
                <button id="next-btn" onclick="nextQuestion()" class="hidden w-full comic-btn py-3.5 bg-emerald-400 hover:bg-emerald-500 border-3 border-slate-900 rounded-2xl font-black text-slate-900 text-base flex items-center justify-center gap-2">
                    Soal Berikutnya <i class="fa-solid fa-arrow-right"></i>
                </button>
            `;
        }

        function checkAnswer(selected, btn) {
            const feedback = document.getElementById('quiz-feedback');
            const nextBtn = document.getElementById('next-btn');
            const optsContainer = document.getElementById('options-container');

            feedback.classList.remove('hidden');

            if (selected === currentQuestion.ans) {
                // Correct Answer!
                SoundFX.playSuccess();
                score += 10;
                streak += 1;

                if (score > highscore) {
                    highscore = score;
                    localStorage.setItem('quiz_bersusun_highscore', highscore);
                }

                updateStats();

                // Disable all option buttons
                const allBtns = optsContainer.querySelectorAll('.opt-btn');
                allBtns.forEach(b => {
                    b.disabled = true;
                    b.classList.add('opacity-70', 'cursor-not-allowed');
                });

                // Highlight correct button in green
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                btn.className = "opt-btn comic-btn p-4 bg-emerald-400 border-3 border-slate-900 rounded-2xl font-black text-slate-900 text-lg sm:text-2xl text-center animate-bounce-short";

                feedback.className = "p-4 rounded-2xl border-3 border-slate-900 text-center font-black text-sm sm:text-base bg-emerald-100 text-emerald-950 flex items-center justify-center gap-2";
                feedback.innerHTML = `<span>🎉</span> <span>HEBAT! Jawabanmu Tepat Sekali (+10 XP)</span>`;

                nextBtn.classList.remove('hidden');
            } else {
                // Wrong Answer!
                SoundFX.playWrong();
                streak = 0;
                updateStats();

                // Lock wrong button in red without revealing correct answer
                btn.disabled = true;
                btn.className = "opt-btn comic-btn p-4 bg-rose-400 border-3 border-slate-900 rounded-2xl font-black text-white text-lg sm:text-2xl text-center opacity-60 cursor-not-allowed";

                feedback.className = "p-4 rounded-2xl border-3 border-slate-900 text-center font-black text-sm sm:text-base bg-rose-100 text-rose-950 flex items-center justify-center gap-2";
                feedback.innerHTML = `<span>❌</span> <span>Kurang tepat! Coba hitung ulang di kertas dan pilih lagi!</span>`;

                nextBtn.classList.add('hidden');
            }
        }

        function nextQuestion() {
            SoundFX.playClick();
            questionNumber++;
            renderQuiz();
        }

        function selectCategory(catKey) {
            SoundFX.playClick();
            currentCategory = catKey;
            questionNumber = 1;

            // Update tab styles
            const catBtns = document.querySelectorAll('.cat-btn');
            catBtns.forEach(btn => {
                btn.className = "cat-btn comic-btn p-3 bg-slate-100 text-slate-800 border-2 border-slate-900 rounded-2xl text-center";
            });

            const activeBtn = document.getElementById(`cat-${catKey}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn comic-btn p-3 bg-indigo-500 text-white border-2 border-slate-900 rounded-2xl text-center";
            }

            renderQuiz();
        }

        function updateStats() {
            document.getElementById('score-count').textContent = score;
            document.getElementById('streak-count').textContent = streak;
            document.getElementById('highscore-count').textContent = highscore;
        }

        function resetStatsModal() {
            SoundFX.playClick();
            document.getElementById('reset-modal').classList.remove('hidden');
        }

        function closeResetModal() {
            SoundFX.playClick();
            document.getElementById('reset-modal').classList.add('hidden');
        }

        function confirmReset() {
            SoundFX.playClick();
            score = 0;
            streak = 0;
            highscore = 0;
            localStorage.removeItem('quiz_bersusun_highscore');
            updateStats();
            closeResetModal();
            questionNumber = 1;
            renderQuiz();
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            updateStats();
            renderQuiz();
        };
    </script>
</body>
</html>
